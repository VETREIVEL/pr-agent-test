<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PR Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --border:    #30363d;
      --muted:     #8b949e;
      --text:      #e6edf3;
      --accent:    #58a6ff;
      --approve:   #3fb950;
      --changes:   #f85149;
      --comment:   #d29922;
      --user-msg:  #1f6feb;
      --agent-msg: #21262d;
      --radius:    10px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px; }

    /* ── Layout ── */
    .app {
      display: grid;
      grid-template-columns: 1fr 420px;
      grid-template-rows: 56px 1fr;
      height: 100vh;
      gap: 0;
    }

    /* ── Header ── */
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header .logo { font-size: 20px; }
    header h1 { font-size: 16px; font-weight: 600; letter-spacing: -0.3px; }
    header .repo-tag {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── Chat panel ── */
    .chat-panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar { width: 6px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg { display: flex; flex-direction: column; max-width: 75%; gap: 4px; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.agent { align-self: flex-start; align-items: flex-start; }

    .msg-label { font-size: 11px; color: var(--muted); font-weight: 500; padding: 0 4px; }

    .msg-bubble {
      padding: 10px 14px;
      border-radius: var(--radius);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .msg-bubble { background: var(--user-msg); border-bottom-right-radius: 3px; }
    .msg.agent .msg-bubble { background: var(--agent-msg); border: 1px solid var(--border); border-bottom-left-radius: 3px; font-family: inherit; }

    .typing { display: flex; align-items: center; gap: 5px; padding: 10px 14px; background: var(--agent-msg); border: 1px solid var(--border); border-radius: var(--radius); border-bottom-left-radius: 3px; width: fit-content; }
    .typing span { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    .chat-input-row {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .chat-input-row textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      padding: 10px 14px;
      resize: none;
      outline: none;
      height: 42px;
      max-height: 140px;
      overflow-y: auto;
      transition: border-color 0.15s;
      line-height: 1.4;
    }
    .chat-input-row textarea:focus { border-color: var(--accent); }
    .chat-input-row textarea::placeholder { color: var(--muted); }

    .send-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      padding: 0 18px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
      align-self: flex-end;
      height: 42px;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Reviews panel ── */
    .reviews-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .reviews-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .reviews-header h2 { font-size: 13px; font-weight: 600; }
    .refresh-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--approve);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    .reviews-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .reviews-list::-webkit-scrollbar { width: 6px; }
    .reviews-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .review-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.15s;
    }
    .review-card:hover { border-color: var(--accent); }

    .review-card-top {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pr-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      color: var(--accent);
      background: rgba(88,166,255,0.1);
      border: 1px solid rgba(88,166,255,0.25);
      border-radius: 5px;
      padding: 2px 7px;
      white-space: nowrap;
    }

    .event-badge {
      font-size: 11px;
      font-weight: 600;
      border-radius: 5px;
      padding: 2px 8px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .event-APPROVE { background: rgba(63,185,80,0.15); color: var(--approve); border: 1px solid rgba(63,185,80,0.3); }
    .event-REQUEST_CHANGES { background: rgba(248,81,73,0.15); color: var(--changes); border: 1px solid rgba(248,81,73,0.3); }
    .event-COMMENT { background: rgba(210,153,34,0.15); color: var(--comment); border: 1px solid rgba(210,153,34,0.3); }

    .review-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .review-repo {
      font-size: 11px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .review-summary {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .review-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--muted);
    }

    .inline-count {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--muted);
      padding: 40px 20px;
      text-align: center;
    }
    .empty-state .icon { font-size: 36px; opacity: 0.4; }
    .empty-state p { font-size: 13px; line-height: 1.5; }

    .welcome-msg {
      align-self: center;
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
      max-width: 320px;
    }
    .welcome-msg .icon { font-size: 40px; margin-bottom: 12px; }
    .welcome-msg h2 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .welcome-msg p { font-size: 13px; line-height: 1.6; }
    .welcome-msg .hints { margin-top: 16px; display: flex; flex-direction: column; gap: 6px; }
    .hint-chip {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      color: var(--muted);
    }
    .hint-chip:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <span class="logo">🤖</span>
    <h1>PR Agent</h1>
    <span class="repo-tag" id="repoTag">loading…</span>
  </header>

  <!-- Chat Panel -->
  <section class="chat-panel">
    <div class="chat-messages" id="chatMessages">
      <div class="welcome-msg">
        <div class="icon">💬</div>
        <h2>Chat with PR Agent</h2>
        <p>Ask me to review PRs, list open pull requests, check CI status, or merge a PR.</p>
        <div class="hints">
          <span class="hint-chip" onclick="sendHint(this)">List open PRs</span>
          <span class="hint-chip" onclick="sendHint(this)">Review PR #1</span>
          <span class="hint-chip" onclick="sendHint(this)">Check CI status for PR #1</span>
        </div>
      </div>
    </div>
    <div class="chat-input-row">
      <textarea id="chatInput" placeholder="Ask the agent anything… (Enter to send, Shift+Enter for new line)" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
  </section>

  <!-- Reviews Panel -->
  <section class="reviews-panel">
    <div class="reviews-header">
      <h2>Auto-Reviews</h2>
      <div class="refresh-dot" title="Auto-refreshes every 10s"></div>
    </div>
    <div class="reviews-list" id="reviewsList">
      <div class="empty-state">
        <div class="icon">🔍</div>
        <p>No reviews yet.<br>Open or update a PR to trigger an auto-review.</p>
      </div>
    </div>
  </section>

</div>

<script>
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');
  const reviewsList = document.getElementById('reviewsList');

  // ── Chat ──────────────────────────────────────────────────────────────────

  function addMessage(role, text) {
    // Remove welcome message on first real message
    const welcome = chatMessages.querySelector('.welcome-msg');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = `
      <span class="msg-label">${role === 'user' ? 'You' : 'Agent'}</span>
      <div class="msg-bubble">${escapeHtml(text)}</div>
    `;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return div;
  }

  function showTyping() {
    const welcome = chatMessages.querySelector('.welcome-msg');
    if (welcome) welcome.remove();

    const div = document.createElement('div');
    div.className = 'msg agent';
    div.id = 'typing-indicator';
    div.innerHTML = `
      <span class="msg-label">Agent</span>
      <div class="typing"><span></span><span></span><span></span></div>
    `;
    chatMessages.appendChild(div);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = chatInput.value.trim();
    if (!text) return;

    chatInput.value = '';
    chatInput.style.height = '42px';
    sendBtn.disabled = true;

    addMessage('user', text);
    showTyping();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      removeTyping();
      if (res.ok) {
        addMessage('agent', data.response);
      } else {
        addMessage('agent', `Error: ${data.detail || 'Unknown error'}`);
      }
    } catch (e) {
      removeTyping();
      addMessage('agent', `Network error: ${e.message}`);
    } finally {
      sendBtn.disabled = false;
      chatInput.focus();
    }
  }

  function sendHint(el) {
    chatInput.value = el.textContent;
    sendMessage();
  }

  // Auto-resize textarea
  chatInput.addEventListener('input', () => {
    chatInput.style.height = '42px';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 140) + 'px';
  });

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── Reviews ───────────────────────────────────────────────────────────────

  function eventClass(event) {
    if (event === 'APPROVE') return 'event-APPROVE';
    if (event === 'REQUEST_CHANGES') return 'event-REQUEST_CHANGES';
    return 'event-COMMENT';
  }

  function eventLabel(event) {
    if (event === 'APPROVE') return '✓ Approved';
    if (event === 'REQUEST_CHANGES') return '✗ Changes';
    return '● Comment';
  }

  function timeAgo(iso) {
    const diff = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
    if (diff < 60) return `${diff}s ago`;
    if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
    if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
    return `${Math.floor(diff / 86400)}d ago`;
  }

  function renderReviews(reviews) {
    if (!reviews || reviews.length === 0) {
      reviewsList.innerHTML = `
        <div class="empty-state">
          <div class="icon">🔍</div>
          <p>No reviews yet.<br>Open or update a PR to trigger an auto-review.</p>
        </div>`;
      return;
    }

    reviewsList.innerHTML = reviews.map(r => `
      <div class="review-card">
        <div class="review-card-top">
          <span class="pr-badge">#${r.pr}</span>
          <span class="event-badge ${eventClass(r.event)}">${eventLabel(r.event)}</span>
        </div>
        <div class="review-title" title="${escapeHtml(r.title || '')}">${escapeHtml(r.title || 'Pull Request #' + r.pr)}</div>
        <div class="review-repo">${escapeHtml(r.repo)}</div>
        ${r.summary ? `<div class="review-summary">${escapeHtml(r.summary)}</div>` : ''}
        <div class="review-footer">
          <span class="inline-count">
            ${r.inline_count > 0 ? `💬 ${r.inline_count} inline comment${r.inline_count !== 1 ? 's' : ''}` : 'No inline comments'}
          </span>
          <span>${timeAgo(r.timestamp)}</span>
        </div>
      </div>
    `).join('');
  }

  async function fetchReviews() {
    try {
      const res = await fetch('/reviews');
      const data = await res.json();
      renderReviews(data.reviews);
    } catch (e) {
      console.error('Failed to fetch reviews:', e);
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  async function fetchRepo() {
    try {
      // infer repo from the reviews or just show hostname
      document.getElementById('repoTag').textContent = window.location.hostname;
    } catch {}
  }

  fetchRepo();
  fetchReviews();
  setInterval(fetchReviews, 10000);
  chatInput.focus();
</script>
</body>
</html>
